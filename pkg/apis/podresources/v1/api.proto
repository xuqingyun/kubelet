// To regenerate api.pb.go run `hack/update-codegen.sh protobindings`
syntax = "proto3";

package v1;
option go_package = "k8s.io/kubelet/pkg/apis/podresources/v1";

// TopologyLevel is the level of topology that the resource is assigned to
enum TopologyLevel {
    NUMA = 0;
    SOCKET = 1;
}

// PodResourcesLister is a service provided by the kubelet that provides information about the
// node resources consumed by pods and containers on the node
service PodResourcesLister {
    rpc List(ListPodResourcesRequest) returns (ListPodResourcesResponse) {}
    rpc GetAllocatableResources(AllocatableResourcesRequest) returns (AllocatableResourcesResponse) {}
    rpc Get(GetPodResourcesRequest) returns (GetPodResourcesResponse) {}
}

message AllocatableResourcesRequest {}

// AllocatableResourcesResponses contains informations about all the devices known by the kubelet
message AllocatableResourcesResponse {
    repeated ContainerDevices devices = 1;
    repeated int64 cpu_ids = 2;
    repeated ContainerMemory memory = 3;
    repeated AllocatableTopologyAwareResource resources = 15;
}

// ListPodResourcesRequest is the request made to the PodResourcesLister service
message ListPodResourcesRequest {}

// ListPodResourcesResponse is the response returned by List function
message ListPodResourcesResponse {
    repeated PodResources pod_resources = 1;
}

// PodResources contains information about the node resources assigned to a pod
message PodResources {
    string name = 1;
    string namespace = 2;
    repeated ContainerResources containers = 3;
    string pod_role = 12;
    string pod_type = 13;
    map<string, string> labels = 14;
    map<string, string> annotations = 15;
}

// ContainerResources contains information about the resources assigned to a container
message ContainerResources {
    string name = 1;
    repeated ContainerDevices devices = 2;
    repeated int64 cpu_ids = 3;
    repeated ContainerMemory memory = 4;
    repeated DynamicResource dynamic_resources = 5;
    repeated TopologyAwareResource resources = 15;
}

// ContainerMemory contains information about memory and hugepages assigned to a container
message ContainerMemory {
    string memory_type = 1;
    uint64 size = 2;
    TopologyInfo topology = 3;
}

// ContainerDevices contains information about the devices assigned to a container
message ContainerDevices {
    string resource_name = 1;
    repeated string device_ids = 2;
    TopologyInfo topology = 3;
}

// Topology describes hardware topology of the resource
message TopologyInfo {
    repeated NUMANode nodes = 1;
}

// NUMA representation of NUMA node
message NUMANode {
    int64 ID = 1;
}

// DynamicResource contains information about the devices assigned to a container by DRA
message DynamicResource {
    // tombstone: removed in 1.31 because claims are no longer associated with one class
    // string class_name = 1;
    string claim_name = 2;
    string claim_namespace = 3;
    repeated ClaimResource claim_resources = 4;
}

// ClaimResource contains resource information. The driver name/pool name/device name
// triplet uniquely identifies the device. Should DRA get extended to other kinds
// of resources, then device_name will be empty and other fields will get added.
// Each device at the DRA API level may map to zero or more CDI devices.
message ClaimResource {
    repeated CDIDevice cdi_devices = 1;
    string driver_name = 2;
    string pool_name = 3;
    string device_name = 4;
    optional string share_id = 5;
}

// CDIDevice specifies a CDI device information
message CDIDevice {
    // Fully qualified CDI device name
    // for example: vendor.com/gpu=gpudevice1
    // see more details in the CDI specification:
    // https://github.com/container-orchestrated-devices/container-device-interface/blob/main/SPEC.md
    string name = 1;
}

// GetPodResourcesRequest contains information about the pod
message GetPodResourcesRequest {
    string pod_name = 1;
    string pod_namespace = 2;
}

// GetPodResourcesResponse contains information about the pod the devices
message GetPodResourcesResponse {
    PodResources pod_resources = 1;
}

// TopologyAwareResource contains information about the allocated resource information in topology aware format
message TopologyAwareResource {
    string resource_name = 1;
    bool is_node_resource = 2;
    bool is_scalar_resource = 3;
    double aggregated_quantity = 4;
    double original_aggregated_quantity = 5; 
    repeated TopologyAwareQuantity topology_aware_quantity_list = 6;
    repeated TopologyAwareQuantity original_topology_aware_quantity_list = 7;
}

// AllocatableTopologyAwareResource contains information about the allocatable resource information in topology aware format
message AllocatableTopologyAwareResource {
    string resource_name = 1;
    bool is_node_resource = 2;
    bool is_scalar_resource = 3;
    double aggregated_allocatable_quantity = 4;
    repeated TopologyAwareQuantity topology_aware_allocatable_quantity_list = 5;
    double aggregated_capacity_quantity = 6;
    repeated TopologyAwareQuantity topology_aware_capacity_quantity_list = 7;
}

// TopologyAwareQuantity contains information about the quantity of a resource in topology aware format
message TopologyAwareQuantity {
    double resource_value = 1;
    uint64 node = 2;
    string name = 3;
    string type = 4;
    TopologyLevel topology_level = 5;
    map<string, string> annotations = 6;
}